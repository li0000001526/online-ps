/* ---------- 事件绑定 ---------- */
function bindEvents(){
  // 顶部按钮
  $('#w-new').addEventListener('click', newDocDialog);
  $('#w-open').addEventListener('click', openImageDialog);
  $('#w-paste').addEventListener('click', async ()=>{
    try{
      const items = await navigator.clipboard.read();
      for(const it of items){
        const t = it.types.find(x=>x.startsWith('image/'));
        if(t){ const blob = await it.getType(t); loadImageFile(blob); return; }
      }
      setHint('剪贴板中没有图片');
    }catch(e){ setHint('无法读取剪贴板，请用 Ctrl+V'); }
  });
  $('#btn-swap').addEventListener('click', ()=>{ const t=fgColor; fgColor=bgColor; bgColor=t; updateColorUI(); });
  $('#sw-fg').addEventListener('click', ()=>{
    const inp=document.createElement('input'); inp.type='color'; inp.value=rgbToHex(fgColor.r,fgColor.g,fgColor.b);
    inp.addEventListener('input',()=>{ const [r,g,b]=hexToRgb(inp.value); fgColor={r,g,b,a:255}; updateColorUI(); });
    inp.click();
  });
  $('#sw-bg').addEventListener('click', ()=>{
    const inp=document.createElement('input'); inp.type='color'; inp.value=rgbToHex(bgColor.r,bgColor.g,bgColor.b);
    inp.addEventListener('input',()=>{ const [r,g,b]=hexToRgb(inp.value); bgColor={r,g,b,a:255}; updateColorUI(); });
    inp.click();
  });
  $('#z-in').addEventListener('click', ()=>zoomAt($('#stage').clientWidth/2,$('#stage').clientHeight/2,1.25));
  $('#z-out').addEventListener('click', ()=>zoomAt($('#stage').clientWidth/2,$('#stage').clientHeight/2,1/1.25));
  $('#z-fit').addEventListener('click', zoomFit);
  $('#z-act').addEventListener('click', zoomActual);
  $('#z-val').addEventListener('click', zoomActual);
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-redo').addEventListener('click', redo);

  // 图层面板头部
  $('#blend-select').addEventListener('change', e=>{
    const l=activeLayer(); if(!l) return;
    l.mode=e.target.value;
    snapshot('混合模式','doc');
    refreshLayerPanel(); render();
  });
  $('#opacity-slider').addEventListener('input', e=>{
    const l=activeLayer(); if(!l) return;
    l.opacity=e.target.value/100;
    $('#opacity-val').textContent=e.target.value+'%';
    render();
  });
  $('#opacity-slider').addEventListener('change', e=>{
    const l=activeLayer(); if(!l) return;
    snapshot('图层不透明度','doc');
    refreshLayerPanel();
  });
  $('#btn-layer-new').addEventListener('click', ()=>doc&&newLayerUI());
  $('#btn-layer-dup').addEventListener('click', ()=>doc&&duplicateLayer());
  $('#btn-layer-up').addEventListener('click', ()=>doc&&moveLayerIdx(1));
  $('#btn-layer-down').addEventListener('click', ()=>doc&&moveLayerIdx(-1));
  $('#btn-layer-merge').addEventListener('click', ()=>doc&&mergeVisible());

  // 面板切换
  $('#side-tabs').addEventListener('click', e=>{
    const t=e.target.closest('.stab'); if(!t) return;
    document.querySelectorAll('.stab').forEach(x=>x.classList.toggle('active',x===t));
    document.querySelectorAll('.side-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t.dataset.panel));
  });

  // 缩放滚轮
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){
      const rect = stage.getBoundingClientRect();
      zoomAt(e.clientX-rect.left, e.clientY-rect.top, e.deltaY<0?1.12:1/1.12);
    } else {
      // 普通滚轮平移
      panX -= e.deltaX; panY -= e.deltaY;
      applyZoom();
    }
  }, {passive:false});
  document.addEventListener('keydown', e=>{
    if(e.key===' ' && !e.target.closest('input,textarea,select')){ spacePan=true; stage.style.cursor='grab'; e.preventDefault(); }
  });
  document.addEventListener('keyup', e=>{ if(e.key===' '){ spacePan=false; stage.style.cursor=''; } });

  // 拖拽打开图片
  window.addEventListener('dragover', e=>{ e.preventDefault(); $('#wdrop').classList.add('show'); });
  window.addEventListener('dragleave', e=>{ if(e.target===document.body) $('#wdrop').classList.remove('show'); });
  window.addEventListener('drop', e=>{
    e.preventDefault();
    $('#wdrop').classList.remove('show');
    const f = e.dataTransfer.files[0];
    if(f&&f.type.startsWith('image/')){ loadImageFile(f, !!$('#file-input').dataset.asLayer); $('#file-input').dataset.asLayer=''; }
  });

  // 粘贴 (系统剪贴板图片)
  window.addEventListener('paste', e=>{
    const items = e.clipboardData&&e.clipboardData.items;
    if(!items) return;
    for(const it of items){
      if(it.type.startsWith('image/')){
        const f = it.getAsFile();
        if(f){ loadImageFile(f, !!doc); setHint('已粘贴图片'+(doc?'为新图层':'')); }
        return;
      }
    }
    // 无图片时若有内部剪贴板则粘贴图层
    if(clipboard&&doc) pasteClipboard();
  });

  // 文件选择(打开为图层)
  const fi = $('#file-input');
  fi.addEventListener('change', e=>{
    const f=e.target.files[0];
    if(f) loadImageFile(f, !!fi.dataset.asLayer);
    fi.dataset.asLayer=''; e.target.value='';
  });
}

/* ---------- 快捷键 ---------- */
function handleKeys(e){
  const t = e.target;
  if(t.closest('input,textarea,select')) return;
  const ctrl = e.ctrlKey||e.metaKey;
  const k = e.key.toLowerCase();
  if(ctrl){
    switch(k){
      case 'z': e.preventDefault(); e.shiftKey?redo():undo(); return;
      case 'y': e.preventDefault(); redo(); return;
      case 's': e.preventDefault(); exportImage('png'); return;
      case 'o': e.preventDefault(); openImageDialog(); return;
      case 'n': e.preventDefault(); newDocDialog(); return;
      case 'c': e.preventDefault(); copySelection(); return;
      case 'v': e.preventDefault(); pasteClipboard(); return;
      case 'a': e.preventDefault(); if(doc){ selection={x:0,y:0,w:doc.w,h:doc.h}; render(); } return;
      case '0': e.preventDefault(); zoomFit(); return;
      case '1': e.preventDefault(); zoomActual(); return;
      case '=': case '+': e.preventDefault(); zoomAt($('#stage').clientWidth/2,$('#stage').clientHeight/2,1.25); return;
      case '-': e.preventDefault(); zoomAt($('#stage').clientWidth/2,$('#stage').clientHeight/2,1/1.25); return;
    }
    return;
  }
  if(e.altKey&&e.key==='Delete'){ e.preventDefault(); fillSelection(); return; }
  if(e.key==='Delete'||e.key==='Backspace'){
    if(selection){ e.preventDefault(); deleteSelection(); }
    return;
  }
  if(e.key==='Escape'){
    if(cropRect){ cropRect=null; updateCropUI(); render(); }
    else selection=null;
    render();
    return;
  }
  if(e.key==='Enter'){
    if(cropRect){ applyCrop(); }
    return;
  }
  if(e.key==='x'){ const t2=fgColor; fgColor=bgColor; bgColor=t2; updateColorUI(); return; }
  if(k==='['){ brushSize=clamp(brushSize-2,1,200); updateToolUI(); return; }
  if(k===']'){ brushSize=clamp(brushSize+2,1,200); updateToolUI(); return; }
  const tool = TOOLS.find(t=>t.key===k.toUpperCase());
  if(tool){ setTool(tool.id); }
}
document.addEventListener('keydown', handleKeys);

/* ---------- 状态栏 ---------- */
function updateStatus(){
  if(!doc){
    $('#st-zoom').textContent='缩放 100%';
    $('#st-size').textContent='—';
    $('#st-layer').textContent='无文档';
    $('#st-tool').textContent='';
    return;
  }
  $('#st-zoom').textContent='缩放 '+Math.round(zoom*100)+'%';
  $('#st-size').textContent=`${doc.w} × ${doc.h}px`;
  const l=activeLayer();
  $('#st-layer').textContent = l?`图层: ${l.name}`:'图层: —';
  $('#st-tool').textContent = '工具: '+(TOOLS.find(t=>t.id===currentTool)?.name||'');
}
function updateCropUI(){
  if(cropRect&&doc){
    setHint('裁剪区域 '+Math.round(cropRect.w)+'×'+Math.round(cropRect.h)+' · Enter 应用 · Esc 取消');
  }
}

/* ================================================================
   初始化
   ================================================================ */
function init(){
  buildMenubar();
  buildToolbar();
  // 混合模式下拉
  $('#blend-select').innerHTML = BLEND_MODES.map(m=>`<option value="${m}">${BLEND_NAMES[m]}</option>`).join('');
  $('#blend-select').value='normal';
  updateColorUI();
  updateToolUI();
  updateStatus();
  bindEvents();
}
init();

/* ================================================================
   测试 API (供 test.js / flow-test.js 使用)
   ================================================================ */
window.PS = {
  version:'1.0',
  api:{
    newDoc:(w,h,bg)=>newDoc(w,h,bg),
    openImageDataURL:(url)=>new Promise(res=>{ loadImageURL(url, false, res); }),
    closeDoc,
    getDocInfo:()=>doc?{w:doc.w,h:doc.h,layers:doc.layers.length}:null,
    getLayerCount:()=>doc?doc.layers.length:0,
    getActiveLayer:()=>activeLayer()?{name:activeLayer().name,kind:activeLayer().kind,w:activeLayer().canvas.width,h:activeLayer().canvas.height}:null,
    getPixel:(lx,ly)=>{
      const l=activeLayer(); if(!l) return null;
      const d=l.ctx.getImageData(clamp(Math.floor(lx),0,l.canvas.width-1),clamp(Math.floor(ly),0,l.canvas.height-1),1,1).data;
      return [d[0],d[1],d[2],d[3]];
    },
    paintPoint:(x,y)=>paintPoint(activeLayer(),x,y),
    brushStroke:(x1,y1,x2,y2)=>{
      const l=activeLayer(); if(!l)return;
      const steps=Math.ceil(Math.hypot(x2-x1,y2-y1)/Math.max(1,brushSize*0.25));
      let last={x:x1,y:y1};
      for(let i=1;i<=steps;i++){ const t=i/steps; const x=lerp(x1,x2,t), y=lerp(y1,y2,t); paintStroke(l,{lastX:last.x,lastY:last.y},x,y,'brush'); last={x,y}; }
      snapshot('画笔','paint');
      refreshLayerPanel();
    },
    fillAt:(x,y,tol)=>{ fillTol=tol===undefined?fillTol:tol; doFloodFill(x,y); },
    applyFilter:(name,opts)=>applyFilterToActive(name,opts),
    addText:(x,y,text,size,color)=>{ const l=makeLayer('文字图层','text'); l.text={text,size:size||36,color:color||'#ffffff',bold:false,font:'Microsoft YaHei'}; renderTextLayer(l); l.x=Math.round(x); l.y=Math.round(y); addLayer(l); snapshot('添加文字','text'); refreshLayerPanel(); render(); },
    addShape:(type,x,y,w,h)=>{ const l=activeLayer(); drawShape(l,{tool:type,sx:x,sy:y,ex:x+w,ey:y+h}); snapshot('绘制形状','paint'); refreshLayerPanel(); render(); },
    newLayer:()=>newLayerUI(),
    duplicateLayer, deleteLayer:()=>{ const l=activeLayer(); if(l&&doc.layers.length>1) removeLayer(l.id); },
    setActiveLayer:(i)=>{ if(doc&&doc.layers[i]){ doc.activeIdx=i; refreshLayerPanel(); render(); } },
    setLayerOpacity:(v)=>{ const l=activeLayer(); if(l){ l.opacity=clamp(v,0,1); snapshot('图层不透明度','doc'); render(); refreshLayerPanel(); } },
    setLayerMode:(m)=>{ const l=activeLayer(); if(l){ l.mode=m; snapshot('混合模式','doc'); render(); refreshLayerPanel(); } },
    setLayerVisible:(i,v)=>{ if(doc&&doc.layers[i]){ doc.layers[i].visible=v; snapshot('显示/隐藏图层','eye'); render(); refreshLayerPanel(); } },
    undo, redo, getHistoryCount:()=>history.length,
    rotate:(dir)=>rotateDoc(dir),
    flip:(dir)=>flipDoc(dir),
    resize:(w,h)=>resizeDoc(w,h),
    crop:(x,y,w,h)=>{ cropRect={x,y,w,h}; applyCrop(); },
    selectRect:(x,y,w,h)=>{ selection={x,y,w,h}; render(); },
    clearSelection:()=>{ selection=null; render(); },
    deleteSelection, fillSelection, copySelection, pasteClipboard,
    exportDataURL:(type)=>{ if(!doc) return null; const cv=document.createElement('canvas'); cv.width=doc.w; cv.height=doc.h; const c=cv.getContext('2d'); for(const l of doc.layers){ if(!l.visible)continue; c.save(); c.globalAlpha=l.opacity; c.globalCompositeOperation=l.mode; c.drawImage(l.canvas,l.x,l.y); c.restore(); } return cv.toDataURL(type==='jpg'?'image/jpeg':'image/png',0.92); },
    setTool, getTool:()=>currentTool,
    setColor:(hex)=>{ const [r,g,b]=hexToRgb(hex); fgColor={r,g,b,a:255}; updateColorUI(); },
    getColor:()=>rgbToHex(fgColor.r,fgColor.g,fgColor.b),
    zoomIn:()=>zoomAt($('#stage').clientWidth/2,$('#stage').clientHeight/2,1.25),
    zoomOut:()=>zoomAt($('#stage').clientWidth/2,$('#stage').clientHeight/2,1/1.25),
    zoomFit, zoomActual, getZoom:()=>zoom,
    getSelection:()=>selection,
  },
  /* 自检: 单元测试 */
  __selfTest:{
    unit(){
      const results=[];
      const eq=(a,b,msg)=>{ const ok=JSON.stringify(a)===JSON.stringify(b); results.push({name:msg,ok}); if(!ok) console.warn('FAIL',msg,{got:a,exp:b}); };
      // 颜色
      eq(hexToRgb('#ff8000'),[255,128,0],'hexToRgb #ff8000');
      eq(hexToRgb('#f80'),[255,136,0],'hexToRgb 缩写 #f80');
      eq(rgbToHex(255,128,0),'#ff8000','rgbToHex');
      const c=parseColor('rgba(10,20,30,0.5)');
      eq([c.r,c.g,c.b,c.a],[10,20,30,128],'parseColor rgba');
      eq(clamp(150,0,100),100,'clamp 上限');
      eq(clamp(-5,0,100),0,'clamp 下限');
      // 油漆桶填充 (纯函数)
      const w=4,h=4;
      const img={width:w,height:h,data:new Uint8ClampedArray(w*h*4)};
      const n=floodFill(img,1,1,[255,0,0,255],0);
      eq(n,w*h,'floodFill 全透明区域填充数量');
      eq([img.data[0],img.data[1],img.data[2],img.data[3]],[255,0,0,255],'floodFill 像素值');
      // 容差
      const img2={width:3,height:1,data:new Uint8ClampedArray([0,0,0,255, 10,0,0,255, 100,0,0,255])};
      const n2=floodFill(img2,0,0,[255,255,255,255],20);
      eq(n2,2,'floodFill 容差 20 覆盖 0 和 10');
      // 亮度滤镜 (1x1)
      const px={width:1,height:1,data:new Uint8ClampedArray([100,100,100,255])};
      FILTERS.brightness(px.data,1,1,50);
      eq([px.data[0],px.data[1]],[150,150],'brightness +50');
      FILTERS.invert(px.data);
      eq(px.data[0],105,'invert 255-150');
      // 模糊保持尺寸
      const bd=new Uint8ClampedArray(9*4).fill(255);
      boxBlur(bd,3,3,1);
      eq(bd.length,36,'boxBlur 数据长度不变');
      // 饱和度
      const sat={width:1,height:1,data:new Uint8ClampedArray([200,50,50,255])};
      FILTERS.saturate(sat.data,1,1,100);
      eq(sat.data[0]>200,true,'saturate +100 提高红通道');
      // 历史序列化往返
      const hd={width:2,height:1,data:new Uint8ClampedArray([10,20,30,255, 40,50,60,255])};
      const st=[{id:'L1',name:'测试',kind:'raster',visible:true,opacity:1,mode:'normal',x:0,y:0,text:null,w:2,h:1,data:hd.data.slice()}];
      const back=st.map(s=>({...s,data:new Uint8ClampedArray(s.data)}));
      eq(Array.from(back[0].data),Array.from(hd.data),'序列化往返像素一致');
      const pass=results.filter(r=>r.ok).length;
      return {total:results.length,pass,fail:results.length-pass,results};
    },
    /* 完整流程测试 */
    async flow(){
      const A=window.PS.api;
      const out=[];
      const check=(name,cond,extra)=>{ out.push({name,ok:!!cond,extra:extra||''}); return !!cond; };
      // 1. 新建文档
      A.newDoc(100,80,'transparent');
      check('新建文档 100×80', A.getDocInfo()&&A.getDocInfo().w===100&&A.getDocInfo().h===80, JSON.stringify(A.getDocInfo()));
      check('初始 1 个图层', A.getLayerCount()===1);
      // 2. 画笔绘制
      A.setColor('#ff0000');
      A.brushStroke(10,10,50,10);
      A.brushStroke(50,10,50,50);
      const p1=A.getPixel(30,10);
      check('画笔留下红色像素', p1&&p1[0]>200&&p1[1]<50, p1&&p1.join(','));
      // 3. 油漆桶 (从透明点 (2,2) 填充, 避开笔迹)
      A.fillAt(2,2,0);
      const p2=A.getPixel(3,3);
      check('油漆桶填充到透明区域', p2&&p2[0]>200, p2&&p2.join(','));
      // 4. 新增图层 + 形状
      A.newLayer();
      check('新增图层后 2 个图层', A.getLayerCount()===2);
      A.setColor('#0000ff');
      A.addShape('rect',10,10,40,30);
      const p3=A.getPixel(20,20);
      check('矩形填充蓝色', p3&&p3[2]>200&&p3[0]<50, p3&&p3.join(','));
      // 5. 混合模式/不透明度
      A.setActiveLayer(1); A.setLayerOpacity(0.5);
      const cvEl = document.querySelector('#canvas');
      const cd = cvEl.getContext('2d').getImageData(20,20,1,1).data;
      check('50%不透明度混合(红底+蓝形=紫)', cd[0]>90 && cd[2]>90 && cd[1]<70, cd.join(','));
      // 6. 滤镜
      A.setActiveLayer(0);
      const before=A.exportDataURL();
      A.applyFilter('blur',3);
      const after=A.exportDataURL();
      check('模糊滤镜改变像素', before!==after);
      A.undo();
      const afterUndo=A.exportDataURL();
      check('撤销恢复模糊前', afterUndo===before);
      A.redo();
      check('重做再次应用', A.exportDataURL()===after);
      // 7. 文字
      A.addText(10,60,'测试文字',24,'#00ff00');
      check('文字图层已创建', A.getLayerCount()===3 && A.getActiveLayer().kind==='text');
      // 8. 选区 + 删除
      A.setActiveLayer(0);
      A.selectRect(0,0,30,30);
      const hadSel=!!A.getSelection();
      A.deleteSelection();
      check('选区删除生效', hadSel);
      // 9. 旋转
      A.rotate('cw');
      const info=A.getDocInfo();
      check('旋转后尺寸互换', info.w===80&&info.h===100, JSON.stringify(info));
      // 10. 导出
      const png=A.exportDataURL('png');
      const imgOk = await new Promise(res=>{
        const im = new Image();
        im.onload = ()=>res(im.naturalWidth===80&&im.naturalHeight===100);
        im.onerror = ()=>res(false);
        im.src = png;
      });
      check('导出 PNG 有效且可解码', typeof png==='string'&&png.startsWith('data:image/png')&&imgOk, png.slice(0,40));
      A.zoomFit();
      check('缩放适应窗口', A.getZoom()>0);
      const pass=out.filter(o=>o.ok).length;
      return {total:out.length,pass,fail:out.length-pass,results:out};
    }
  }
};
